[package]
name = "t22"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "t22"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build",
             "anchor-spl/idl-build", 
                ]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", features = ["token_2022", "token_2022_extensions"] }
spl-token-confidential-transfer-proof-extraction = "=0.5.1"
solana-zk-elgamal-proof-interface = "0.1"
bytemuck = "1"




[dev-dependencies]
litesvm = "0.16.0"
solana-keypair = "3.1.2"
solana-message = "4"
solana-signer = "3.0.1"
solana-transaction = "4.1.4"
solana-account = "4"
solana-system-interface = "3.2"
solana-compute-budget-interface = "3"
solana-instruction = "3"
solana-zk-sdk-pod = "0.1"
zk = { package = "solana-zk-sdk", version = "7" }
t22new = { package = "spl-token-2022-interface", version = "3.1" }
proofgen = { package = "spl-token-confidential-transfer-proof-generation", version = "0.6" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
